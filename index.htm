<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Spiritomb Collection</title>


<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#7c3aed">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/cards.css">
    <link rel="stylesheet" href="css/modal.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/mobile.css">

</head>

<body>

<div id="background"></div>

<div id="app">

    <header>

        <div class="logo">

    <img src="assets/images/icono.png" alt="Spiritomb">

</div>

        <div>

            <h1>Spiritomb Collection</h1>

            <p>Master Collection Tracker</p>

        </div>

    </header>



    <section class="progressSection">

        <div class="progressInfo">

            <span id="ownedCount">

                0 / 20

            </span>

            <span id="percentage">

                0%

            </span>

        </div>

        <div class="progressBar">

            <div id="progressFill"></div>

        </div>

    </section>



    <section class="searchContainer">

        <input
        id="searchInput"
        type="text"
        placeholder="Buscar expansión...">

    </section>



    <main id="cardContainer">

    </main>

</div>

<script src="js/cards.js"></script>

<script src="js/storage.js"></script>

<script src="js/ui.js"></script>

<script src="js/app.js"></script>

</body>

</html>
