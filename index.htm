<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Spiritomb Collection</title>


<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/variables.css">

<link rel="stylesheet" href="css/animations.css">

<link rel="stylesheet" href="css/header.css">

<link rel="stylesheet" href="css/cards.css">

<link rel="stylesheet" href="css/modal.css">

<link rel="stylesheet" href="css/mobile.css">

<link rel="stylesheet" href="css/style.css">

</head>


<body>

<div id="loader">

    <div class="loaderBox">

        <img src="assets/images/icono.png">

        <h2>
        Cargando colección...
        </h2>


        <div class="loadingBar">

            <div id="loadingProgress"></div>

        </div>


        <p id="loadingText">
        Conectando con Pokémon TCG...
        </p>


    </div>

</div>

<div id="app">


<header class="hero">

    <img src="442.gif" class="heroLogo">

    <h1>SPIRITOMB</h1>

    <span>Collection</span>

</header>


<section class="progressSection">

    <div class="progressTitle">
        Progreso de colección
    </div>


    <div class="collectionProgress">

        <div id="progressFill"></div>

    </div>


    <div class="progressInfo">

        <span id="ownedCount">
            0 / 3
        </span>


        <span id="percentage">
            0%
        </span>

    </div>

</section>




<main id="cardContainer">

</main>


</div>
<div id="modal" class="modal">

    <div class="modalContent">

        <button id="closeModal">
            ✕
        </button>


        <img id="modalImage">


        <h2 id="modalName"></h2>

        <p id="modalSet"></p>

        <p id="modalNumber"></p>


        <button id="modalButton">
            Añadir a colección
        </button>


    </div>

</div>


<script src="js/api.js"></script>

<script src="js/cache.js"></script>

<script src="js/apiLoader.js"></script>

<script src="js/storage.js"></script>

<script src="js/ui.js"></script>

<script src="js/modal.js"></script>

<script src="js/app.js"></script>
<script src="js/effects.js"></script>


</body>

</html>
