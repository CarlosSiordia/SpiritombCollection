<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Spiritomb Collection</title>


<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/modal.css">

<link rel="stylesheet" href="css/cards.css">


</head>


<body>

<div id="loader">

    <div class="loaderBox">

        <img src="assets/images/icono.png">

        <h2>
        Cargando colección...
        </h2>


        <div class="loadingBar">

            <div id="loadingProgress"></div>

        </div>


        <p id="loadingText">
        Conectando con Pokémon TCG...
        </p>


    </div>

</div>

<div id="app">


<header>

<div class="logo">

<img src="assets/images/icono.png">

</div>


<div>

<h1>
Spiritomb Collection
</h1>

<p>
Master Collection Tracker
</p>

</div>

</header>



<section class="progressSection">


<div class="progressInfo">

<span id="ownedCount">
0 / 3
</span>


<span id="percentage">
0%
</span>


</div>


<div class="progressBar">

<div id="progressFill"></div>

</div>


</section>




<main id="cardContainer">

</main>


</div>
<div id="modal" class="modal">

    <div class="modalContent">

        <button id="closeModal">
            ✕
        </button>


        <img id="modalImage">


        <h2 id="modalName"></h2>

        <p id="modalSet"></p>

        <p id="modalNumber"></p>


        <button id="modalButton">
            Añadir a colección
        </button>


    </div>

</div>


<script src="js/api.js"></script>

<script src="js/cache.js"></script>

<script src="js/apiLoader.js"></script>

<script src="js/storage.js"></script>

<script src="js/ui.js"></script>

<script src="js/modal.js"></script>

<script src="js/app.js"></script>



</body>

</html>
